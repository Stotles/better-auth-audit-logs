name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true # never use caching in release builds (cache-poisoning hardening)

      # Bun installs and builds, but we publish with npm: bun publish doesn't
      # support npm trusted publishing (OIDC) yet, so it can't mint provenance
      # from the `id-token` permission (https://github.com/oven-sh/bun/issues/22423).
      # Node 24.18.0+ bundles npm >= 11.16, which has `npm stage publish`.
      - name: Use Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)" >&2
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Publish to npm
        # Using staged publish for added security (OIDC trusted publishing, no token)
        run: npm stage publish
